name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release App
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Determine Version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="$INPUT_VERSION"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RAW_VERSION="${{ github.event.release.tag_name }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi

          # Strip leading lowercase 'v'
          RAW_VERSION="${RAW_VERSION#v}"

          # Strictly validate semantic version (e.g. 1.0.0 or 1.0.0-beta.1)
          if [[ ! "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version string: '$RAW_VERSION'. Must follow semantic versioning with a lowercase 'v' tag (e.g., v1.0.0)."
            exit 1
          fi

          echo "VERSION=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Test Suite
        run: swift test

      - name: Setup Apple Signing Certificate (Optional)
        id: setup_signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary-keychain-password"
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F '"' '{print $2}')
            echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "Signing with Developer ID identity: $IDENTITY"
          else
            echo "No Developer ID certificate configured. Using ad-hoc signature."
          fi

      - name: Build and Sign Application Bundle
        run: ./scripts/package-app.sh "${{ steps.get_version.outputs.VERSION }}" --app-only

      - name: Notarize and Staple Application Bundle (Optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$CODESIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Packaging temporary ZIP for Apple notarization..."
            ditto -c -k --keepParent dist/DisplayToggle.app dist/DisplayToggle-submission.zip

            echo "Submitting DisplayToggle.app for Apple notarization..."
            xcrun notarytool submit dist/DisplayToggle-submission.zip \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            rm -f dist/DisplayToggle-submission.zip

            echo "Stapling notarization ticket to DisplayToggle.app..."
            xcrun stapler staple dist/DisplayToggle.app
            echo "DisplayToggle.app successfully stapled."
          else
            echo "Apple notarization credentials not provided or codesign identity missing. Skipping app notarization."
          fi

      - name: Create Distributable Archives (ZIP and DMG)
        run: ./scripts/package-app.sh "${{ steps.get_version.outputs.VERSION }}" --archives-only

      - name: Staple DMG (Optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CODESIGN_IDENTITY" ] && [ -n "$APPLE_ID" ]; then
            echo "Stapling notarization ticket to DisplayToggle.dmg..."
            xcrun stapler staple dist/DisplayToggle.dmg || true
          fi

      - name: Calculate Release Checksums
        run: |
          cd dist
          shasum -a 256 DisplayToggle.dmg > DisplayToggle.dmg.sha256
          shasum -a 256 DisplayToggle.zip > DisplayToggle.zip.sha256
          cat DisplayToggle.dmg.sha256

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "DisplayToggle v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          files: |
            dist/DisplayToggle.dmg
            dist/DisplayToggle.dmg.sha256
            dist/DisplayToggle.zip
            dist/DisplayToggle.zip.sha256
          generate_release_notes: true

      - name: Publish Cask to Homebrew Tap (Optional)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not configured. Skipping automated Homebrew Tap update."
            exit 0
          fi

          echo "==> Updating Homebrew Tap repository..."
          DMG_SHA256=$(awk '{print $1}' dist/DisplayToggle.dmg.sha256)
          TAP_REPO_URL="https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/jrussellsmyth/homebrew-tap.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          rm -rf "$TAP_DIR"
          git clone "$TAP_REPO_URL" "$TAP_DIR"

          mkdir -p "$TAP_DIR/Casks"
          sed "s/^          //" <<EOF > "$TAP_DIR/Casks/displaytoggle.rb"
          cask "displaytoggle" do
            version "${VERSION}"
            sha256 "${DMG_SHA256}"

            url "https://github.com/jrussellsmyth/displaytoggle/releases/download/v#{version}/DisplayToggle.dmg"
            name "DisplayToggle"
            desc "Lightweight macOS menu bar tool to quickly toggle the primary display"
            homepage "https://github.com/jrussellsmyth/displaytoggle"

            depends_on macos: ">= :sequoia"

            app "DisplayToggle.app"

            zap trash: [
              "~/Library/Preferences/com.displaytoggle.DisplayToggleApp.plist",
            ]
          end
          EOF

          cd "$TAP_DIR"
          git add Casks/displaytoggle.rb
          if git diff --staged --quiet; then
            echo "Cask in tap is already up to date. No commit needed."
          else
            git commit -m "bump(cask): update displaytoggle to v${VERSION}"
            git push origin HEAD
            echo "Successfully updated displaytoggle cask in jrussellsmyth/homebrew-tap!"
          fi
